# ResQ AI - reverse proxy in front of the Next.js frontend (docker-compose.yml "proxy").
#
# Why it exists: Next.js keeps an X-Forwarded-For header sent by the client as-is, so when
# Next.js is exposed directly anyone can claim any IP address and dodge the per-client rate
# limits (SOS SMS, chat, registration, sign-in). This proxy OVERWRITES X-Forwarded-For with a
# single address it can vouch for, and the frontend is configured with TRUSTED_PROXY_HOPS=1
# (FRONTEND_TRUSTED_PROXY_HOPS in the root .env) and trusts exactly that one entry.
#
# Which address: by default the TCP peer ($remote_addr). If you put an HTTPS terminator or
# load balancer (Caddy, Traefik, another nginx, a cloud LB) in front of this proxy, the peer
# is that load balancer, and every visitor would share its address - one rate-limit bucket
# for the whole site. List the load balancer's address range(s) in trusted-proxies.conf
# (mounted as /etc/nginx/resq-trusted-proxies.conf, see that file): nginx's realip module
# then takes the client address from the X-Forwarded-For entries added by those trusted
# hops (right to left, skipping trusted addresses), so $remote_addr below is the real
# visitor again. Keep FRONTEND_TRUSTED_PROXY_HOPS=1 in that setup: this proxy still sends a
# single, already resolved address.
#
# Logs: almost every API call carries the visitor's location in its query string
# (?lat=28.6139&lon=77.209), and next to the client address and a timestamp that is personal
# location data. The access log therefore records $uri (the path WITHOUT the query string)
# instead of the image's default "main" format with the full $request, plus the upstream
# status and timing so failures stay visible. The error log of this server is kept at "crit":
# nginx's "error" lines (e.g. an upstream that cannot be reached) quote the full request line
# with its query; the access log still shows those requests as 502/504 with upstream_status.

# conf.d files are included in the http context, where log_format must be defined.
log_format resq_no_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent rt=$request_time '
                         'upstream=$upstream_status urt=$upstream_response_time';

server {
    listen 8080;
    server_name _;

    server_tokens off;
    # The Next.js proxy accepts JSON bodies up to 1 MB.
    client_max_body_size 2m;

    # No query strings (= user coordinates) in the logs, see the top of this file.
    access_log /dev/stdout resq_no_query;
    error_log /dev/stderr crit;

    # Trusted load balancers in front of this proxy (set_real_ip_from lines). The glob makes
    # the file optional; without any set_real_ip_from nothing is trusted and $remote_addr is
    # the TCP peer.
    include /etc/nginx/resq-trusted-proxies*.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Liveness probe for the container health check (does not touch Next.js).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Resolve "frontend" through Docker's DNS at request time (not once at start-up), so a
    # restarted frontend container with a new IP keeps working.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend_upstream http://frontend:3000;

    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;

        # $http_host keeps the port (e.g. localhost:3000) so redirects built by Next.js
        # (sign-in, middleware) point back to the published address.
        proxy_set_header Host $http_host;
        # Overwrite (never append to) whatever the client sent. $remote_addr is the real
        # client: the TCP peer, or - for requests from a trusted load balancer - the address
        # the realip module recovered from its X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";

        # Above the app's own upstream timeout (20 s) so Next.js answers first.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
