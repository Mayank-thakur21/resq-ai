# ResQ AI - load balancers trusted to report the client address (nginx realip module).
#
# Mounted into the "proxy" service as /etc/nginx/resq-trusted-proxies.conf and included by
# default.conf. Leave it without set_real_ip_from lines when browsers connect to this proxy
# directly (the default): then nothing is trusted and the TCP peer is the client.
#
# When an HTTPS terminator / load balancer sits in front of this proxy, add ONE line per
# address range it connects from - and nothing broader: every address listed here can make
# up client addresses. The load balancer must append the address it received the request
# from to X-Forwarded-For (Caddy, Traefik, AWS ALB, Google Cloud LB and nginx with
# $proxy_add_x_forwarded_for all do). Keep FRONTEND_TRUSTED_PROXY_HOPS=1.
#
# Examples (uncomment and adapt):
#
#   Caddy / Traefik / nginx on the Docker host, reaching the published port via the bridge:
#     set_real_ip_from 172.16.0.0/12;
#
#   A cloud load balancer in a private VPC subnet:
#     set_real_ip_from 10.0.0.0/16;
#
#   IPv6 load balancer subnet:
#     set_real_ip_from fd00:1234::/64;
